<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cthulhu Abenteuer-Archiv</title>
    <!-- Tailwind CSS für schnelles, sauberes Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0a0a0a',
                        cardbg: '#121212',
                        gold: '#d4af37',
                        goldlight: '#f3e5ab',
                        golddark: '#aa8c2c',
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        playfair: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0a0a0a;
            color: #d4af37;
            font-family: 'Playfair Display', serif;
        }
        h1, h2, h3, h4, .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        /* Feine, dezente Goldränder und Ornamente */
        .gold-border {
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(212, 175, 55, 0.05);
        }
        .gold-border-glow {
            border: 1px solid rgba(212, 175, 55, 0.6);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.15), inset 0 0 15px rgba(212, 175, 55, 0.08);
        }
        .gold-text {
            color: #d4af37;
            text-shadow: 0 0 2px rgba(212,175,55,0.2);
        }
        /* Benutzerdefinierte Scrollbar im Stil */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #332912; border: 1px solid #d4af37; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-gold selection:text-obsidian">

    <!-- INTRO OVERLAY -->
    <div id="intro-overlay" class="fixed inset-0 z-50 bg-obsidian flex flex-col items-center justify-center p-6 transition-opacity duration-1000">
        <!-- Ältestenzeichen als Intro-Symbol -->
        <div class="mb-6 opacity-85">
            <svg class="w-20 h-20 text-gold animate-pulse" viewBox="0 0 100 100" fill="currentColor">
                <polygon points="50,5 61,35 93,35 67,55 77,85 50,70 23,85 33,55 7,35 39,35" fill="none" stroke="currentColor" stroke-width="2"/>
                <circle cx="50" cy="50" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
                <circle cx="50" cy="50" r="3" fill="currentColor"/>
            </svg>
        </div>
        <h2 class="text-2xl font-cinzel gold-text tracking-widest mb-8 text-center">Das Unbekannte erwacht</h2>
        <div id="youtube-container" class="w-full max-w-3xl aspect-video mb-8 gold-border rounded bg-black overflow-hidden relative shadow-2xl">
            <!-- Wird dynamisch mit YouTube-Iframe gefüllt -->
            <div id="yt-player-slot" class="w-full h-full flex items-center justify-center text-gold/50 text-sm">Lade Omen...</div>
        </div>
        <button onclick="skipIntro()" class="px-8 py-3 bg-obsidian border border-gold/60 text-gold font-cinzel tracking-wider hover:bg-gold hover:text-obsidian transition-all duration-300 shadow-lg">
            Intro überspringen &rarr;
        </button>
    </div>

    <!-- HEADER / NAVIGATION -->
    <header class="w-full border-b border-gold/20 bg-obsidian/90 sticky top-4 z-40 backdrop-blur">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <!-- Ältestenzeichen Logo -->
                <svg class="w-10 h-10 text-gold" viewBox="0 0 100 100" fill="currentColor">
                    <polygon points="50,5 61,35 93,35 67,55 77,85 50,70 23,85 33,55 7,35 39,35" fill="none" stroke="currentColor" stroke-width="2.5"/>
                    <circle cx="50" cy="50" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
                <h1 class="text-xl md:text-2xl font-cinzel gold-text tracking-widest">Cthulhu Abenteuer</h1>
            </div>
            <div class="flex items-center gap-6">
                <button onclick="openAdminLogin()" class="text-xs font-cinzel uppercase tracking-widest text-gold/70 hover:text-gold border-b border-transparent hover:border-gold transition-all">
                    &equiv; Admin-Bereich
                </button>
            </div>
        </div>
    </header>

    <!-- HAUPTINHALT -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-6 py-10 space-y-16">
        
        <!-- PROMINENTES ABENTEUER (HERVORGEHOBEN) -->
        <section id="featured-adventure-section" class="w-full">
