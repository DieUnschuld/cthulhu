<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cthulhu - Chroniken des Wahnsinns</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: { 400: '#d4af37', 500: '#c5a059', 600: '#aa8c2c' },
                        darkbg: '#050505',
                        panelbg: '#0d0d0d'
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        fell: ['IM Fell English', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            color: #d1d5db;
            font-family: 'IM Fell English', serif;
            letter-spacing: 0.03em;
        }
        h1, h2, h3, .font-cinzel {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.08em;
        }
        .gold-border {
            border: 1px solid #c5a059;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 10px rgba(197,160,89,0.2);
        }
        .gold-glow {
            text-shadow: 0 0 8px rgba(197, 160, 89, 0.4);
        }
        .corner-ornament {
            position: absolute;
            width: 15px;
            height: 15px;
            border-color: #c5a059;
            pointer-events: none;
        }
        .corner-tl { top: 4px; left: 4px; border-top: 2px solid; border-left: 2px solid; }
        .corner-tr { top: 4px; right: 4px; border-top: 2px solid; border-right: 2px solid; }
        .corner-bl { bottom: 4px; left: 4px; border-bottom: 2px solid; border-left: 2px solid; }
        .corner-br { bottom: 4px; right: 4px; border-bottom: 2px solid; border-right: 2px solid; }
    </style>
</head>

        </div>
        <button onclick="skipIntro()" class="font-cinzel px-8 py-3 border border-gold-500 text-gold-400 hover:bg-gold-500 hover:text-black transition-all duration-300 tracking-widest text-sm uppercase">

        </header>

                <div class="corner-ornament corner-br"></div>
